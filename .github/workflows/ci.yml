name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test public checkout without private/
        run: |
          test ! -d private
          python -m pytest -q
      - name: Ruff
        run: ruff check src tests scripts
      - name: Secret and private-path scan
        run: python scripts/check_public.py
      - name: Offline multi-source smoke
        run: python scripts/offline_multisource_smoke.py
      - name: Admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/applypilot/admin.py").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", text, flags=re.S)
          Path("/tmp/applypilot-admin.js").write_text("\n".join(blocks), encoding="utf-8")
          print(f"{len(blocks)} script block(s)")
          PY
          node --check /tmp/applypilot-admin.js
      - name: Build wheel and sdist
        run: python -m build
