# Add only candidate details that you want ApplyPilot to use.
name = ""
location = ""
english_level = ""
profile_version = "example-1"
reviewed = false
# Optional: use an account label to keep separate HH profiles' history isolated.
# account = "my-hh-account"

[limits]
per_run = 5
per_day = 20

[apply]
delay_min_seconds = 5
delay_max_seconds = 12
confirmation_timeout_seconds = 15

[llm]
enabled = false
model = "openrouter/free"

[cover_letter]
# Explicit mode takes priority over llm.enabled. Use "template" or "llm" to enable.
mode = "off"
fallback_to_template = false
template = """
Здравствуйте!
Меня заинтересовала вакансия «{vacancy}».
Буду рад обсудить задачи и подробнее рассказать о своём опыте.
С уважением, {name}
"""
# Alternatively, remove template and set template_file = "cover-letter.md".

[professional]
# Fill only with your actual experience. Empty optional fields are omitted.
summary = ""
skills = []
# UTF-8 .txt/.md path relative to this profile; PDF/DOCX are not supported.
# resume_file = "resume.md"
# Or use inline resume_text instead of resume_file.

# Repeat these tables for each role/project; uncomment and fill with real facts.
# [[professional.experience]]
# company = ""
# role = ""
# period = ""
# description = ""
# achievements = []

[screen]
model = "gpt-5-mini"
# Candidate-specific screening preferences are optional and have no hidden defaults.
# constraints = ""
# salary_expectation = ""
# criteria = ""
# experience_years = 0

# [[professional.projects]]
# name = ""
# role = ""
# description = ""
# technologies = []
# achievements = []

[resumes]
default = "REPLACE_WITH_EXACT_HH_RESUME_TITLE"

[answers]
motivation = "Describe your motivation here."
