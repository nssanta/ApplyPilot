# Укажите только те данные кандидата, которые ApplyPilot действительно должен использовать.
name = ""
location = ""
english_level = ""
profile_version = "example-1"
reviewed = false

# Необязательно: отдельный ключ аккаунта изолирует историю разных профилей HH.
# account = "my-hh-account"

[limits]
per_run = 5
per_day = 20

[apply]
delay_min_seconds = 5
delay_max_seconds = 12
confirmation_timeout_seconds = 15

[llm]
enabled = false
model = "openrouter/free"

[cover_letter]
# Явный mode имеет приоритет над llm.enabled.
# Для включения используйте "template" или "llm".
mode = "off"
# Для mode = "llm" можно выбрать "aitunnel" или "openrouter".
# provider = "aitunnel"
fallback_to_template = false
template = """
Здравствуйте!
Меня заинтересовала вакансия «{vacancy}».
Буду рад обсудить задачи и подробнее рассказать о своём опыте.
С уважением, {name}
"""
# Вместо inline-шаблона можно удалить template и задать:
# template_file = "cover-letter.md"

[professional]
# Заполняйте только подтверждёнными фактами о своём опыте.
# Пустые необязательные поля не передаются модели.
summary = ""
skills = []

# Путь к UTF-8 .txt/.md относительно каталога профиля.
# PDF/DOCX автоматически не разбираются.
# resume_file = "resume.md"

# Вместо resume_file можно задать полный текст прямо здесь:
# resume_text = ""

# Повторяйте таблицу для каждого места работы.
# [[professional.experience]]
# company = ""
# role = ""
# period = ""
# description = ""
# achievements = []

# Повторяйте таблицу для каждого проекта.
# [[professional.projects]]
# name = ""
# role = ""
# description = ""
# technologies = []
# achievements = []

[screen]
model = "gpt-5-mini"
# Необязательные персональные правила скрининга.
# Если поле пустое, скрытые предпочтения не подставляются.
# constraints = ""
# salary_expectation = ""
# criteria = ""
# experience_years = 0

[resumes]
# Точное название резюме на HH.
default = "REPLACE_WITH_EXACT_HH_RESUME_TITLE"

[answers]
motivation = "Опишите здесь свою мотивацию."
