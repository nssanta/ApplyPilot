# Базовый пример поискового профиля.
queries = ["Software Engineer", "Developer"]
areas = [113]
max_pages = 1
request_budget = 50

# relevance сохраняет историческое поведение CLI.
# Явно используйте newest или balanced, если нужна другая стратегия.
sort_mode = "relevance"

only_remote = false
days = 7
min_score = 0
skip_high_security = false
details_limit = 50

[salary]
currency = "RUR"
from = 0
missing = "include"
