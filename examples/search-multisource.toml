# Пример поисковой конфигурации Multi-Source.
# Пределы 100/run и 300/day — техническая ёмкость, не обязательный объём.
[search]
queries = [
  "AI engineer", "LLM engineer", "AI agent", "RAG", "NLP",
  "machine learning", "generative AI", "python",
]
days = 14
max_pages = 2
request_budget = 240
details_limit = 120
only_remote = true

[salary]
from = 120000
currency = "RUR"
missing = "include"

[filters]
# Неизвестная география не должна молча превращаться в подтверждённый remote.
unknown_remote = "review"
