[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot"
version = "0.1.0"
description = "Local, explainable HH.ru job-search and application workflow"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "build>=1,<2"]

[project.scripts]
applypilot = "applypilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002"]
